<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bug Tracker — Add/Edit Bug Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<style>
  :root {
    --bg: #F5F5F2;
    --surface: #FFFFFF;
    --border: #E4E4E1;
    --ink: #1C1E21;
    --ink-soft: #6B6E73;
    --accent: #3B4B6B;
    --accent-light: #5D7099;
    --accent-soft: #EEF1F6;
    --danger: #DC2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* Fake page behind, just for context */
  .fake-page { padding: 20px 28px; opacity: 0.4; filter: blur(1px); pointer-events: none; user-select: none; }
  .fake-topbar { height: 56px; background: var(--surface); border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border); }
  .fake-row { height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }

  /* Demo controls (not part of the real UI) */
  .demo-controls { position: fixed; top: 14px; left: 14px; z-index: 100; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px; display: flex; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .demo-controls button { border: none; background: transparent; padding: 7px 12px; border-radius: 6px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
  .demo-controls button.active { background: var(--accent); color: white; }

  /* Overlay + modal */
  .overlay { position: fixed; inset: 0; background: rgba(20,22,25,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { width: 620px; max-width: 92vw; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }

  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 16.5px; margin: 0; }
  .modal-header .bug-id-tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .close-btn { background: transparent; border: none; cursor: pointer; color: var(--ink-soft); padding: 6px; border-radius: 6px; display: flex; }
  .close-btn:hover { background: #F0F0EE; color: var(--ink); }
  .close-btn svg { width: 18px; height: 18px; }

  .modal-body { padding: 20px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; font-weight: 600; }
  .field .req { color: var(--danger); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px;
    font-family: inherit; font-size: 13.5px; color: var(--ink); resize: vertical;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .field textarea { min-height: 64px; }

  .readonly-field { display: flex; align-items: center; gap: 8px; background: #F5F5F2; border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; color: var(--ink-soft); font-size: 13.5px; }
  .readonly-field svg { width: 14px; height: 14px; }

  .select-preview { display: flex; align-items: center; gap: 8px; }
  .select-preview select { flex: 1; }
  .preview-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .preview-icon svg { width: 15px; height: 15px; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); }
  .btn-primary, .btn-ghost { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; border-radius: 7px; padding: 9px 18px; font-family: inherit; font-size: 13.5px; }
  .btn-primary { background: var(--accent); color: white; border: none; box-shadow: 0 1px 2px rgba(59,75,107,0.25); }
  .btn-primary:hover { background: #2E3B54; }
  .btn-ghost { background: var(--surface); color: var(--ink-soft); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #F0F0EE; color: var(--ink); }
  .btn-primary svg, .btn-ghost svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<div class="demo-controls">
  <button id="btnAddMode" class="active" onclick="setMode('add')">Preview: Add New</button>
  <button id="btnEditMode" onclick="setMode('edit')">Preview: Edit</button>
</div>

<!-- Faint page behind, just for context -->
<div class="fake-page">
  <div class="fake-topbar"></div>
  <div class="fake-row"></div>
  <div class="fake-row"></div>
  <div class="fake-row"></div>
</div>

<div class="overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">Add New Bug</h2>
        <div class="bug-id-tag" id="modalBugId" style="display:none">BUG-1042</div>
      </div>
      <button class="close-btn"><i data-feather="x"></i></button>
    </div>

    <div class="modal-body">
      <div class="field full">
        <label>Title <span class="req">*</span></label>
        <input type="text" id="fieldTitle" placeholder="Short summary of the bug">
      </div>

      <div class="field full">
        <label>Description <span class="req">*</span></label>
        <textarea id="fieldDesc" placeholder="What happened? Steps to reproduce, if known."></textarea>
      </div>

      <div class="field full">
        <label>Expected Behavior</label>
        <textarea id="fieldExpected" placeholder="What should have happened instead?"></textarea>
      </div>

      <div class="field">
        <label>Affected Build <span class="req">*</span></label>
        <select id="fieldBuild">
          <option>2.4.1</option><option>2.4.0</option><option>2.3.9</option><option>2.3.8</option><option>2.3.7</option>
        </select>
      </div>

      <div class="field">
        <label>Impact <span class="req">*</span></label>
        <div class="select-preview">
          <div class="preview-icon" id="impactPreview"><i data-feather="alert-triangle"></i></div>
          <select id="fieldImpact" onchange="updatePreview('impact')">
            <option>Cosmetic</option><option>Minor</option><option selected>Major</option><option>Critical</option><option>Blocker</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Status</label>
        <div class="select-preview">
          <div class="preview-icon" id="statusPreview"><i data-feather="circle"></i></div>
          <select id="fieldStatus" onchange="updatePreview('status')">
            <option>Open</option><option>In Progress</option><option>In Test</option><option>On Hold</option><option>Needs Support</option><option>Resolved</option><option>Closed</option><option>Not an issue</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Reporter</label>
        <div class="readonly-field" id="reporterField"><i data-feather="user"></i>You (Sreejith)</div>
      </div>

      <div class="field">
        <label>Responsible</label>
        <select id="fieldResponsible">
          <option>Unassigned</option><option>Arjun</option><option>Meera</option><option>Lena</option><option>Nithin</option><option>Thomas</option><option>Sreejith</option>
        </select>
      </div>

      <div class="field full" id="fixedBuildField" style="display:none">
        <label>Fixed Build</label>
        <select id="fieldFixedBuild">
          <option value="">— Not fixed yet —</option>
          <option>2.4.1</option><option>2.4.0</option><option>2.3.9</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-ghost">Cancel</button>
      <button class="btn-primary" id="submitBtn"><i data-feather="check"></i>Create Bug</button>
    </div>
  </div>
</div>

<script>
const STATUS_META = {
  "Open": { color: "#2563EB", icon: "circle" },
  "In Progress": { color: "#D97706", icon: "refresh-cw" },
  "In Test": { color: "#7C3AED", icon: "activity" },
  "Resolved": { color: "#059669", icon: "check-circle" },
  "Closed": { color: "#6B7280", icon: "x-circle" },
  "On Hold": { color: "#B45309", icon: "pause-circle" },
  "Needs Support": { color: "#DC2626", icon: "life-buoy" },
  "Not an issue": { color: "#9CA3AF", icon: "slash" }
};
const IMPACT_META = {
  "Cosmetic": { color: "#9CA3AF", icon: "eye" },
  "Minor": { color: "#3B82F6", icon: "alert-circle" },
  "Major": { color: "#F59E0B", icon: "alert-triangle" },
  "Critical": { color: "#EF4444", icon: "zap" },
  "Blocker": { color: "#7F1D1D", icon: "alert-octagon" }
};

function updatePreview(type) {
  if (type === 'impact') {
    const val = document.getElementById('fieldImpact').value;
    const meta = IMPACT_META[val];
    const el = document.getElementById('impactPreview');
    el.style.background = meta.color + "22";
    el.style.color = meta.color;
    el.innerHTML = `<i data-feather="${meta.icon}"></i>`;
  } else {
    const val = document.getElementById('fieldStatus').value;
    const meta = STATUS_META[val];
    const el = document.getElementById('statusPreview');
    el.style.background = meta.color + "22";
    el.style.color = meta.color;
    el.innerHTML = `<i data-feather="${meta.icon}"></i>`;
    document.getElementById('fixedBuildField').style.display =
      (val === 'Resolved' || val === 'Closed') ? 'block' : 'none';
  }
  feather.replace();
}

function setMode(mode) {
  document.getElementById('btnAddMode').classList.toggle('active', mode === 'add');
  document.getElementById('btnEditMode').classList.toggle('active', mode === 'edit');

  if (mode === 'add') {
    document.getElementById('modalTitle').textContent = 'Add New Bug';
    document.getElementById('modalBugId').style.display = 'none';
    document.getElementById('fieldTitle').value = '';
    document.getElementById('fieldDesc').value = '';
    document.getElementById('fieldExpected').value = '';
    document.getElementById('fieldBuild').value = '2.4.1';
    document.getElementById('fieldImpact').value = 'Major';
    document.getElementById('fieldStatus').value = 'Open';
    document.getElementById('fieldStatus').disabled = false;
    document.getElementById('reporterField').innerHTML = '<i data-feather="user"></i>You (Sreejith)';
    document.getElementById('fieldResponsible').value = 'Unassigned';
    document.getElementById('submitBtn').innerHTML = '<i data-feather="check"></i>Create Bug';
  } else {
    document.getElementById('modalTitle').textContent = 'Edit Bug';
    document.getElementById('modalBugId').style.display = 'block';
    document.getElementById('fieldTitle').value = 'Login button unresponsive on Safari';
    document.getElementById('fieldDesc').value = 'Clicking login does nothing on Safari 17, works fine on Chrome.';
    document.getElementById('fieldExpected').value = 'Clicking Login should navigate to the dashboard.';
    document.getElementById('fieldBuild').value = '2.4.1';
    document.getElementById('fieldImpact').value = 'Major';
    document.getElementById('fieldStatus').value = 'In Progress';
    document.getElementById('reporterField').innerHTML = '<i data-feather="user"></i>Meera';
    document.getElementById('fieldResponsible').value = 'Arjun';
    document.getElementById('submitBtn').innerHTML = '<i data-feather="check"></i>Save Changes';
  }
  updatePreview('impact');
  updatePreview('status');
  feather.replace();
}

setMode('add');
feather.replace();
</script>

</body>
</html>
